[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["vendor"]
default-members = ["crates/*", "apps/evopdf", "apps/evopdf-cli", "xtask"]

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/tazerty/evopdf"

[workspace.dependencies]
# Shared frontend components; engines remain independent of egui.
evo-ui = { path = "vendor/evo-libs/evo-ui", version = "0.1.0", features = ["serde"] }
# Quit the macOS way (#1136): ⌘Q asks about unsaved changes, and closing quits through `terminate:`.
evo-quit = { path = "vendor/evo-libs/evo-quit", version = "0.1.0" }
# Shared system spooler; document composition remains in evopdf-print.
evo-print = { path = "vendor/evo-libs/evo-print", version = "0.1.0" }
# Whether a path stored in a document may be opened (GoToR link targets).
evo-docpath = { path = "vendor/evo-libs/evo-docpath", version = "0.1.0" }
# internal
evopdf-geom = { path = "crates/geom", version = "0.14.0" }
evopdf-filters = { path = "crates/filters", version = "0.14.0" }
evopdf-cos = { path = "crates/cos", version = "0.14.0" }
evopdf-crypt = { path = "crates/crypt", version = "0.14.0" }
evopdf-organize = { path = "crates/organize", version = "0.14.0" }
evopdf-measure = { path = "crates/measure", version = "0.14.0" }
evopdf-annot = { path = "crates/annot", version = "0.14.0" }
evopdf-audit = { path = "crates/audit", version = "0.14.0" }
evopdf-fonts = { path = "crates/fonts", version = "0.14.0" }
evopdf-model = { path = "crates/model", version = "0.14.0" }
evopdf-content = { path = "crates/content", version = "0.14.0" }
evopdf-redact = { path = "crates/redact", version = "0.14.0" }
evopdf-print = { path = "crates/print", version = "0.14.0" }
evopdf-xfdf = { path = "crates/xfdf", version = "0.14.0" }
evopdf-sign = { path = "crates/sign", version = "0.14.0" }
evopdf-optimize = { path = "crates/optimize", version = "0.14.0" }
evopdf-a11y = { path = "crates/a11y", version = "0.14.0" }
evopdf-oracle = { path = "crates/oracle", version = "0.14.0" }
evopdf-testkit = { path = "crates/testkit", version = "0.14.0" }
evopdf-ocr = { path = "crates/ocr", version = "0.14.0" }
evopdf-js = { path = "crates/js", version = "0.14.0" }
evopdf-compare = { path = "crates/compare", version = "0.14.0" }
evopdf-preflight = { path = "crates/preflight", version = "0.14.0" }
evopdf-export = { path = "crates/export", version = "0.14.0" }
evopdf-edit = { path = "crates/edit", version = "0.14.0" }
evopdf-create = { path = "crates/create", version = "0.14.0" }
evopdf-forms = { path = "crates/forms", version = "0.14.0" }
evopdf-xfa = { path = "crates/xfa", version = "0.14.0" }
evopdf-render = { path = "crates/render", version = "0.14.0" }
evopdf-engine = { path = "crates/engine", version = "0.14.0" }
evopdf-platform = { path = "crates/platform", version = "0.14.0" }
evopdf-ui-egui = { path = "crates/ui-egui", version = "0.14.0" }
evopdf-automation = { path = "crates/automation", version = "0.14.0", default-features = false }

# pdf
hayro = "0.7.1"
hayro-syntax = "0.7.2"
lopdf = "0.45"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
weezl = "0.2"

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
kurbo = "0.13"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

# testing
proptest = "1"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# `"*"` matches every non-workspace package: crates.io dependencies and the
# vendored crates under `vendor/` (excluded from the workspace). Dependencies
# carry no debug info and our own crates only line tables: backtraces and
# panics still show file and line, while test binaries and the target dir stay
# small (each UI test binary had a 500-600 MB PDB on Windows, #454).
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.low-disk]
inherits = "dev"
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1

# Vendored, patched third-party crates (see vendor/README.md). Each patch is meant to go upstream.
[patch.crates-io]
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro = { path = "vendor/hayro" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-cmap = { path = "vendor/hayro-cmap" }
hayro-postscript = { path = "vendor/hayro-postscript" }
hayro-jbig2 = { path = "vendor/hayro-jbig2" }
lopdf = { path = "vendor/lopdf" }
winit = { path = "vendor/winit" }
egui-wgpu = { path = "vendor/egui-wgpu" }
vello_common = { path = "vendor/vello_common" }
