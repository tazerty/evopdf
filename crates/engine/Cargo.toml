[package]
name = "evopdf-engine"
description = "EvoPdf engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
evo-docpath = { workspace = true }
evopdf-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
evopdf-render = { workspace = true }
evopdf-cos = { workspace = true }
evopdf-organize = { workspace = true }
evopdf-annot = { workspace = true }
evopdf-forms = { workspace = true }
evopdf-xfa = { workspace = true }
evopdf-edit = { workspace = true }
evopdf-audit = { workspace = true }
evopdf-redact = { workspace = true }
evopdf-print = { workspace = true }
evopdf-xfdf = { workspace = true }
evopdf-sign = { workspace = true }
evopdf-optimize = { workspace = true }
evopdf-a11y = { workspace = true }
evopdf-ocr = { workspace = true }
evopdf-js = { workspace = true }
evopdf-compare = { workspace = true }
evopdf-preflight = { workspace = true }
evopdf-export = { workspace = true }
evopdf-fonts = { workspace = true }
evopdf-create = { workspace = true }
evopdf-model = { workspace = true }
evopdf-geom = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (through image and evopdf-create): image's TiffEncoder can't set the
# resolution or the compression of an exported page.
tiff = "0.11"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"
unicode-segmentation = "1.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today"). The workspace
# entry is std-only; this target adds `clock` for `chrono::Local::now`.
chrono = { workspace = true, features = ["clock"] }

[dev-dependencies]
evopdf-testkit = { workspace = true }
