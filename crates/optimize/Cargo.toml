[package]
name = "evopdf-optimize"
description = "The PDF Optimizer: image downsampling and recompression, discarding objects, clean-up"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
evopdf-cos = { workspace = true }
evopdf-filters = { workspace = true }
evopdf-content = { workspace = true }
evopdf-model = { workspace = true }
evopdf-annot = { workspace = true }
thiserror.workspace = true
# JPEG decoding (zune-jpeg) and encoding, and bicubic resampling; already in the tree.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# The same JPEG decoder, used directly to read samples untransformed (/ColorTransform 0).
zune-jpeg = "0.5"

[dev-dependencies]
evopdf-render = { workspace = true }
